name: Regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m py_compile scripts/forge_neo_resolution_presets.py scripts/forge_neo_resolution_presets_settings.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check javascript/forge_neo_resolution_presets_settings.js
      - name: Settings state regression tests
        run: node --test tests/test_settings_state.cjs
      - name: Profile JSON
        run: python -m json.tool profiles.json > /dev/null

  publish_v1_0_1:
    needs: test
    if: >-
      github.repository == 'ukr8b3g-cmyk/Forge-Neo-Resolution-Presets' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'Release v1.0.1: protect Profile drafts and Unicode saves'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified v1.0.1 without replacing older releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = {...context.repo};
            const tag = 'v1.0.1';
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({...repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let ref;
            try {
              ref = (await github.rest.git.getRef({...repo, ref: `tags/${tag}`})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (ref && (ref.object.type !== 'commit' || ref.object.sha !== context.sha)) {
              throw new Error('Existing tag has a different target; refusing to replace it');
            }
            if (existing) {
              if (!ref || existing.draft || existing.prerelease) throw new Error('Existing release is inconsistent');
              core.info(`Release already exists: ${existing.html_url}`);
              return;
            }
            const release = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: context.sha,
              name: 'v1.0.1 — Profile editor data preservation fixes',
              body: fs.readFileSync('docs/RELEASE_v1.0.1.md', 'utf8'),
              draft: false, prerelease: false
            });
            core.info(release.data.html_url);
